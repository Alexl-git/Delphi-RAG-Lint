<!-- Source of assets/share/default.png (the site-wide share card, 1200x630).
     Render: msedge --headless --hide-scrollbars --window-size=1200,630 --virtual-time-budget=3000
             --screenshot=<out.png> file:///<this file>
     Colours and fonts are the site's (assets/style.css). -->
<style>
@font-face{font-family:"Plex Serif";src:url('../assets/fonts/IBMPlexSerif-SemiBold.woff2') format('woff2')}
@font-face{font-family:"Plex Sans";src:url('../assets/fonts/IBMPlexSans-Regular.woff2') format('woff2')}
@font-face{font-family:"Plex Sans";font-weight:600;src:url('../assets/fonts/IBMPlexSans-SemiBold.woff2') format('woff2')}
@font-face{font-family:"Plex Mono";src:url('../assets/fonts/IBMPlexMono-Regular.woff2') format('woff2')}
@font-face{font-family:"Plex Mono";font-weight:500;src:url('../assets/fonts/IBMPlexMono-Medium.woff2') format('woff2')}
html,body{margin:0;padding:0;background:#141C24}
svg{display:block}
</style>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F7FA"/><stop offset=".45" stop-color="#C9D2DB"/><stop offset="1" stop-color="#7F8C99"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A74B8"/><stop offset="1" stop-color="#22406E"/>
    </linearGradient>

      <stop offset="0" stop-color="#E6ECF1"/><stop offset=".5" stop-color="#AEB9C4"/><stop offset="1" stop-color="#6E7B88"/>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/>

  <rect width="1200" height="630" fill="#141C24"/>

  <rect x="18" y="0" width="18" height="630" fill="#9E3535"/>
  <rect x="36" y="0" width="18" height="630" fill="#176E5F"/>

  <rect x="112" y="226" width="130" height="5" fill="#4A74B8"/>
  <text font-family="Plex Sans" font-size="28" fill="#C3CCD5">
    <tspan x="110" y="290">Index, query and lint</tspan>
    <tspan x="110" y="328">Delphi code - CLI and IDE.</tspan>
  </text>
  <text x="110" y="400" font-family="Plex Sans" font-size="21" fill="#8C99A6">

  <text x="110" y="592" font-family="Plex Sans" font-size="18" fill="#6E7B88">by HTR Micronite</text>

    <text x="640" y="214"><tspan fill="#2B4C82" font-weight="500">unit</tspan> Orders;</text>

    <g fill="#3A4753">
      <rect x="962" y="282" width="10" height="1.4"/><rect x="962" y="290" width="6" height="1.4"/>
